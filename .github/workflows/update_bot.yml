name: Update Bot

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  update:
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Build bot package
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Deploy and release bot in Orchestrator
        uses: botcity-dev/botcity-action-bots@v1.0.6
        with:
          deploy: true
          release: true
          botId: ${{ vars.BOT_ID }}
          technology: python
          botPath: ./bot.zip
          version: ${{ github.run_number }}
        env:
          LOGIN: ${{ secrets.LOGIN }}
          SERVER: ${{ secrets.SERVER }}
          KEY: ${{ secrets.KEY }}
